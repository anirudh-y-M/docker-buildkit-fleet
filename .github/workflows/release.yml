name: Release chart

# Tag the commit `v<chart version>` (for example v0.1.0) to publish:
#   - the chart to oci://ghcr.io/<owner>/charts/buildkit-fleet
#   - a GitHub Release with the packaged .tgz attached
#   - Artifact Hub repository metadata, once artifacthub-repo.yml has a repositoryID
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CHART_DIR: charts/buildkit-fleet

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Tag must match Chart.yaml version
        run: |
          chart_version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$chart_version" != "$tag" ]; then
            echo "::error::tag v$tag does not match Chart.yaml version $chart_version"; exit 1
          fi
          echo "version=$chart_version" >> "$GITHUB_ENV"
          # OCI namespaces are lowercase.
          echo "oci_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Lint and render
        run: |
          helm lint "$CHART_DIR"
          helm template t "$CHART_DIR" --namespace buildkit > /dev/null

      - name: Package
        run: helm package "$CHART_DIR" --destination dist

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/buildkit-fleet-${version}.tgz" "oci://${oci_repo}"

      - name: Push Artifact Hub metadata
        run: |
          if [ -z "$(yq '.repositoryID' "$CHART_DIR/artifacthub-repo.yml")" ]; then
            echo "artifacthub-repo.yml has no repositoryID yet; skipping"; exit 0
          fi
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz | tar xz oras
          echo "${{ secrets.GITHUB_TOKEN }}" | ./oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd "$CHART_DIR"
          ../../oras push "${oci_repo}/buildkit-fleet:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/buildkit-fleet-*.tgz
          generate_release_notes: true
