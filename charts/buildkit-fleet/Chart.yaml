apiVersion: v2
name: buildkit-fleet
description: >-
  A horizontally scalable fleet of warm BuildKit shards for CI. One StatefulSet
  per CPU architecture, one cache disk per shard, mTLS, an admission cap per
  shard, and a per-architecture autoscaler. Pairs with the setup-buildkit
  GitHub Action for repository-sticky routing with spillover mechanism.
type: application
version: 0.2.0
appVersion: "v0.33.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - buildkit
  - buildx
  - docker
  - ci
  - build-cache
  - multi-arch
  - github-actions
home: https://github.com/anirudh-y-M/docker-buildkit-fleet
sources:
  - https://github.com/anirudh-y-M/docker-buildkit-fleet
maintainers:
  - name: Anirudh Yadav
    url: https://github.com/anirudh-y-M
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Architecture
      url: https://github.com/anirudh-y-M/docker-buildkit-fleet/blob/main/docs/architecture.md
    - name: Operations
      url: https://github.com/anirudh-y-M/docker-buildkit-fleet/blob/main/docs/operations.md
    - name: setup-buildkit action
      url: https://github.com/anirudh-y-M/docker-buildkit-fleet/tree/main/actions/setup-buildkit
  artifacthub.io/changes: |
    - kind: changed
      description: The default image is now a rebuild of upstream BuildKit v0.33.0 (ghcr.io/anirudh-y-m/docker-buildkit-fleet/buildkit), compiled on a current Go with patched dependencies, scan-gated, signed and published weekly; pinned by digest
    - kind: security
      description: The rebuilt image reports zero fixable critical or high vulnerabilities, down from 193 findings on the upstream v0.33.0-rootless image
    - kind: added
      description: loadProbe.image to run the load-probe sidecar from a different image than buildkitd
